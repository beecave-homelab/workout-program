services:
  app:
    build: .
    ports:
      - "${NEXT_PORT}:3001"  # Next.js application
      - "${API_PORT}:5001"   # API server
    volumes:
      - .:/app
      - /app/node_modules
    env_file:
      - .env
    environment:
      - NODE_ENV=development
      - HOST=0.0.0.0
      - PORT=3001
    networks:
      - app-network
    depends_on:
      - db

  db:
    image: mariadb:10.11.10
    ports:
      - "${DB_PORT}:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    env_file:
      - .env
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASSWORD}
      - MYSQL_DATABASE=${DB_NAME}
      - MYSQL_USER=${DB_USER}
      - MYSQL_PASSWORD=${DB_PASSWORD}
    networks:
      - app-network

volumes:
  mariadb_data:

networks:
  app-network:
    driver: bridge
